name: Portfolio checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: portfolio-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: |
          node --check script.js
          node --check updates.js
          node --check case-study.js
          node --check backend/server.js
      - name: Validate public JSON data and schemas
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const read = (file) => JSON.parse(fs.readFileSync(file, 'utf8'));
          const site = read('data/site-data.json');
          if (!site || typeof site.status !== 'object' ||
              typeof site.status.label !== 'string' ||
              typeof site.status.state !== 'string' ||
              typeof site.status.description !== 'string' ||
              !Array.isArray(site.focus)) {
            throw new Error('data/site-data.json schema is invalid');
          }
          for (const item of site.focus) {
            if (!item || typeof item.name !== 'string' ||
                typeof item.kind !== 'string' || typeof item.state !== 'string') {
              throw new Error('data/site-data.json contains an invalid focus item');
            }
          }
          for (const file of ['data/changelog.json', 'data/achievements.json']) {
            const data = read(file);
            if (!Array.isArray(data) || data.length > 200) {
              throw new Error(file + ' must be an array with at most 200 records');
            }
          }
          console.log('Public JSON data and schemas are valid.');
          NODE
      - name: Validate HTML, local assets, anchors and SEO files
        run: python scripts/validate_portfolio.py
      - name: Check required pages and assets
        run: |
          test -f index.html
          test -f roadmap.html
          test -f fluffy.html
          test -f paw-art-studio.html
          test -f phoenix-rp.html
          test -f songid.html
          test -f updates.html
          test -f 404.html
          test -f sitemap.xml
          test -f robots.txt
          test -f case-study.css
          test -f updates.css
