name: Portfolio checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: |
          node --check script.js
          node --check updates.js
          node --check case-study.js
          node --check admin/app.js
          node --check backend/server.js
      - name: Validate public JSON data and schemas
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const read = (file) => JSON.parse(fs.readFileSync(file, 'utf8'));
          const site = read('data/site-data.json');
          if (!site || typeof site.status !== 'object' ||
              typeof site.status.label !== 'string' ||
              typeof site.status.state !== 'string' ||
              typeof site.status.description !== 'string' ||
              !Array.isArray(site.focus)) {
            throw new Error('data/site-data.json schema is invalid');
          }
          for (const file of ['data/changelog.json', 'data/achievements.json']) {
            if (!Array.isArray(read(file))) throw new Error(file + ' must be a JSON array');
          }
          console.log('Public JSON data and schemas are valid.');
          NODE
      - name: Validate HTML, local assets and anchors
        run: python scripts/validate_portfolio.py
      - name: Check required pages and assets
        run: |
          test -f index.html
          test -f roadmap.html
          test -f fluffy.html
          test -f paw-art-studio.html
          test -f phoenix-rp.html
          test -f songid.html
          test -f updates.html
          test -f case-study.css
          test -f updates.css
          test -f admin/index.html
          test -f .github/workflows/portfolio-cms.yml
          test -f backend/server.js
          test -f backend/package.json
