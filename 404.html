<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <meta name="theme-color" content="#080a12">
  <meta name="description" content="Страница не найдена — Cr1stalik Portfolio.">
  <link rel="canonical" href="https://cr1staloriginal.github.io/404.html">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <title>404 — Страница не найдена | Cr1stalik</title>
  <style>
    .not-found{min-height:100svh;display:grid;place-items:center;padding:28px;text-align:center}
    .not-found-inner{max-width:620px;padding:clamp(28px,6vw,56px);border:1px solid var(--line);border-radius:22px;background:rgba(17,21,39,.72);box-shadow:var(--shadow)}
    .not-found-code{font:700 clamp(5rem,20vw,9rem)/.9 'Space Grotesk',sans-serif;letter-spacing:-.08em;background:linear-gradient(120deg,var(--purple),var(--cyan));background-clip:text;-webkit-background-clip:text;color:transparent}
    .not-found h1{margin:20px 0 10px;font:600 clamp(1.5rem,5vw,2.2rem) 'Space Grotesk',sans-serif}
    .not-found p{margin:0 auto 25px;max-width:440px;color:var(--muted);line-height:1.8}
  </style>
</head>
<body>
  <main class="not-found">
    <section class="not-found-inner">
      <div class="not-found-code" aria-hidden="true">404</div>
      <h1>Похоже, эта страница потерялась</h1>
      <p>Такого адреса нет в портфолио. Вернись на главную или открой один из проектов.</p>
      <a class="btn primary" href="index.html">На главную ↗</a>
    </section>
  </main>
</body>
</html>
